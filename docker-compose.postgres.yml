# Optional Postgres overlay — does not change default SQLite one-click:
#   docker compose up -d --build
# Production / dual-backend verify:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#   bash scripts/verify_postgres.sh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: token
      POSTGRES_PASSWORD: token
      POSTGRES_DB: token_rankings
    ports:
      - "5432:5432"
    volumes:
      - rankings-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token -d token_rankings"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  token-rankings:
    environment:
      DATABASE_URL: postgresql://token:token@postgres:5432/token_rankings
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rankings-pg:
