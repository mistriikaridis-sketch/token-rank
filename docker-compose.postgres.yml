# Optional Postgres overlay — does not change the default SQLite one-click:
#   docker compose up -d --build
# Production / dual-backend verify (POSTGRES_PASSWORD is required; no default):
#   POSTGRES_PASSWORD='长随机密码' docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#   bash scripts/verify_postgres.sh
#
# Required env (shell or .env):
#   POSTGRES_PASSWORD   database password. Do not use "token". Letters and digits only
#                       (the value is placed in DATABASE_URL).
# Optional:
#   POSTGRES_USER       role name, default token (this is not the password)
#   POSTGRES_DB         database name, default token_rankings
#
# Host port 5432 is bound to 127.0.0.1 only. Other machines cannot reach it.
# Do not publish Postgres on 0.0.0.0.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-token}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Do not use token.}
      POSTGRES_DB: ${POSTGRES_DB:-token_rankings}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rankings-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  token-rankings:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-token}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-token_rankings}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rankings-pg:
